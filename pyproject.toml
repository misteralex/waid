##
# @file pyproject.toml
# @brief Python project build and dependency specification file.
# @details Configures setuptools build backend, package name, python version, and core dependencies.
# @author AF
# @date 2026

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waid"
version = "0.1.0"
description = "WAID draft and lab repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes
    "I",   # Isort (import sorting)
    "D",   # Pydocstyle (docstring conventions)
]
ignore = [
    "D100", # Missing docstring in public module (handled by custom WAID header check)
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google" # O "sphinx" se preferisci mappare i tag standard