[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waid"
version = "0.1.0"
description = "WAID draft and lab repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru",
]