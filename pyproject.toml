##
# @file pyproject.toml
# @brief Python project build and dependency specification file.
# @details Configures setuptools build backend, package name, python version, and core dependencies.
# @author AF
# @date 2026

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waid"
version = "1.0.0"
description = "WAID draft and lab repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*", "mock*"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "F",   # Pyflakes
    "I",   # Isort (import sorting)
    "D",   # Pydocstyle (docstring conventions)
]
ignore = [
    "D100", # Missing docstring in public module (handled by custom WAID header check)
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google" # O "sphinx" se preferisci mappare i tag standard

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["src", "build", "dist", ".git", ".venv"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    "ignore::pydantic.warnings.ArbitraryTypeWarning",
]