# ==============================================================================
# @file dbt_project.yml
# @brief Main project configuration file for the WAID dbt project.
# @details Defines project metadata, model materialization strategy, directory
#          paths, and default threshold variables used across telemetry and
#          ERA5 bias analysis models.
# ==============================================================================

# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'waid'
version: '1.0.0'
profile: 'waid'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Relative paths for dbt clean
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  waid:
    staging:
      +materialized: view

tests:
  waid:
    +store_failures: false

vars:
  max_bias_temp: "{{ env_var('WAID_ML_BIAS_TEMP', '5.0') }}"
  max_bias_pres: "{{ env_var('WAID_ML_BIAS_PRES', '10.0') }}"
  max_bias_rh: "{{ env_var('WAID_ML_BIAS_RH', '20.0') }}"
  max_bias_wind: "{{ env_var('WAID_ML_BIAS_WIND', '5.0') }}"
  max_bias_solar: "{{ env_var('WAID_ML_BIAS_SOLAR', '100.0') }}"
  max_bias_rain: "{{ env_var('WAID_ML_BIAS_RAIN', '1.0') }}"