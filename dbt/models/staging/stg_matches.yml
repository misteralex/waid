version: 2

models:
  - name: stg_matches
    description: "Dataset unificato di validazione tra Ecowitt e ERA5"
    columns:
      # Chiave temporale comune
      - name: timestamp
        tests:
          - not_null
          - unique

      # Validazione campi Ecowitt unificati
      - name: ecowitt_temp
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 50
      
      # Validazione campi ERA5 unificati
      - name: era5_temp
        tests:
          - dbt_utils.accepted_range:
              min_value: -60
              max_value: 60
              
      # Controllo di coerenza (opzionale ma consigliato per i match)
      - name: bias_temp
        description: "Differenza assoluta tra temperatura Ecowitt e ERA5"
        tests:
          - dbt_utils.accepted_range:
              min_value: -20
              max_value: 20 # soglia di tolleranza massima tra sensore e modello