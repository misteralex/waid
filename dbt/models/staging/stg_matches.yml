version: 2

models:
  - name: stg_matches
    description: "Unified validation dataset comparing Ecowitt local sensor observations and ERA5 reanalysis."
    columns:
      # Primary time-series key
      - name: timestamp
        tests:
          - not_null
          - unique

      # Validation for unified Ecowitt fields
      - name: ecowitt_temp
        tests:
          - dbt_utils.accepted_range:
              min_value: -30
              max_value: 50
      
      # Validation for unified ERA5 fields
      - name: era5_temp
        tests:
          - dbt_utils.accepted_range:
              min_value: -60
              max_value: 60
              
      # Consistency check between ground sensor and reanalysis model
      - name: bias_temp
        description: "Calculated bias (difference) between Ecowitt and ERA5 temperature measurements."
        tests:
          - dbt_utils.accepted_range:
              min_value: -20
              max_value: 20 # Maximum tolerance threshold between local sensor and benchmark model