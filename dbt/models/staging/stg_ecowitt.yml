version: 2

models:
  - name: stg_ecowitt
    columns:
      - name: timestamp
        tests:
          - not_null
          - unique

      - name: temperature
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 50

      - name: pressure_hpa
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 800
                max_value: 1100

      - name: humidity
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: wind_speed
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 80

      - name: solar_radiation
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1500

      - name: hourly_rain
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300