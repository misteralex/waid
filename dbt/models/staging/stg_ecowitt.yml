version: 2

# @file stg_ecowitt.yml
# @author AF
# @date 2026

models:
  - name: stg_ecowitt
    description: "Staged and cleaned Ecowitt weather station data model"
    columns:
      - name: timestamp
        description: "Primary timestamp for the weather record"
        tests:
          - not_null
          - unique

      - name: temperature
        description: "Outdoor temperature in degrees Celsius"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 50

      - name: pressure_hpa
        description: "Absolute atmospheric pressure in hPa"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 800
                max_value: 1100

      - name: humidity
        description: "Outdoor relative humidity percentage"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: wind_speed
        description: "Wind speed in meters per second"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 80

      - name: solar_radiation
        description: "Solar radiation in Watts per square meter"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1500

      - name: hourly_rain
        description: "Hourly precipitation in millimeters"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300